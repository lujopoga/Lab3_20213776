<!DOCTYPE html>
<html lang="es" xmlns:th="http://www.w3.org/1999/xhtml">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Lista de Hospitales</title>
</head>
<body>
<div th:replace="fragments/navbar :: navbar"></div>
<h1>Lista de Hospitales</h1>

<table>
    <thead>
    <tr>
        <th>Nombre</th>
        <th>Dirección</th>
        <th>Teléfono</th>
        <th>Acciones</th>
    </tr>
    </thead>
    <tbody>
    <tr th:each="hospital : ${hospitales}">
        <td th:text="${hospital.nombre}"></td>
        <td th:text="${hospital.direccion}"></td>
        <td th:text="${hospital.telefono}"></td>
        <td>
            <a th:href="@{'/hospitales/' + ${hospital.id} + '/doctores'}">
                <button>Mostrar doctores</button>
            </a>
            <a th:href="@{'/hospitales/' + ${hospital.id} + '/pacientes'}">
                <button>Mostrar pacientes</button>
            </a>
        </td>
    </tr>
    </tbody>
</table>

</body>
</html>
